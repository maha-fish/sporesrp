modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description="${mod_description}"
logoFile="sporesrp_logo.png"
authors="${mod_authors}"

# NeoForge 依赖
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

# Minecraft 依赖
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# spore 依赖
[[dependencies.${mod_id}]]
modId="spore"
type="required"
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"